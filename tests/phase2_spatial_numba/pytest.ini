[pytest]
# Local to this suite (the repository pyproject is not used or edited). Run: pytest -c tests/phase2_spatial_numba/pytest.ini tests/phase2_spatial_numba
# with PYTHONPATH = <materialized 9f bundle>/editable : <bundle>/source/src : <candidate>/src, CUDA_VISIBLE_DEVICES="" and NUMBA_NUM_THREADS=1 (CPU lane).
testpaths = .
addopts = -p no:cacheprovider
