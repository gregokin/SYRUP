[pytest]
# Local to this suite. Run: pytest -c tests/phase2_floating_column/pytest.ini tests/phase2_floating_column
# CPU lane (CUDA_VISIBLE_DEVICES="", NUMBA_NUM_THREADS=1) with PYTHONPATH = <materialized 9f bundle>/editable : <bundle>/source/src : <candidate>/src.
testpaths = .
addopts = -p no:cacheprovider
