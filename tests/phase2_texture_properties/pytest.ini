[pytest]
# Local to this suite. Run: pytest -c tests/phase2_texture_properties/pytest.ini tests/phase2_texture_properties
# CPU lane (CUDA_VISIBLE_DEVICES="", NUMBA_NUM_THREADS=1) with PYTHONPATH = <materialized 9f bundle>/editable : <bundle>/source/src : <candidate>/src.
# Host-compiled CUDA source execution + plumbing doubles are NOT hardware evidence. test_cuda_definitions.py is skipped without a GPU (Root runs it).
testpaths = .
addopts = -p no:cacheprovider
