[pytest]
# Local to this suite. Run: pytest -c tests/phase2_cuda_shared_body/pytest.ini tests/phase2_cuda_shared_body
# with PYTHONPATH = <9f bundle>/editable : <bundle>/source/src : <candidate>/src, CUDA_VISIBLE_DEVICES="" (CPU only; no GPU, no CuPy, no NVRTC is used by any test here).
testpaths = .
addopts = -p no:cacheprovider
