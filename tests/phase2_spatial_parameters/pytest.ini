[pytest]
# Local to this suite (the repository pyproject is not used or edited). Run: pytest -c tests/phase2_spatial_parameters/pytest.ini tests/phase2_spatial_parameters
# with PYTHONPATH = <materialized 9f bundle>/editable : <bundle>/source/src : <candidate>/src and CUDA_VISIBLE_DEVICES="" for the CPU lane.
testpaths = .
addopts = -p no:cacheprovider
