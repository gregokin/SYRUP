[pytest]
# Local to this suite. Run: pytest -c tests/phase2_moisture_output/pytest.ini tests/phase2_moisture_output
# CPU lane (CUDA_VISIBLE_DEVICES="", NUMBA_NUM_THREADS=1) with PYTHONPATH = <materialized 9f bundle>/editable : <bundle>/source/src : <candidate>/src.
# The genuine small native daily fixtures are reused read-only from tests/phase15_recharge. test_gpu_definitions.py is skipped without a GPU (Root runs it).
testpaths = .
addopts = -p no:cacheprovider
