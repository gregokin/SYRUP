[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maple-syrup"
version = "0.0.1.dev0"
description = "MAPLE-SYRUP (Sediment Yield, Runoff, and Uptake by Plants): water extension for MAPLE"
requires-python = ">=3.11"
# MAPLE itself is deliberately NOT listed here. Its distribution name is
# `maple` (version 0.0.1, /home/okin/MAPLE/pyproject.toml), which is also
# the name of an unrelated project on PyPI, and MAPLE is not published
# anywhere. A bare `maple` requirement would let a resolver fetch that
# unrelated package; a `maple @ file://...` reference would pin a mutable
# live checkout by absolute path. Neither is acceptable (AGENTS.md), so the
# dependency is resolved from the running environment and its identity,
# source origin and required API surface are verified at runtime by
# `maple_syrup.dependency`. See docs/phase1/interface_contract.md section 1.
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# Phase 4b: optional compiled CPU routing sweep (routing_numba.py). Never a
# base dependency; the array implementation stays the default and there is
# no silent fallback. Codex tested Numba 0.67.0 / llvmlite 0.49.0 on
# NumPy 2.5.2 / Python 3.12.3 in an isolated tree outside MAPLE's venv.
numba = [
    "numba>=0.61",
]
# CW-E5: `maple_syrup.dependency_bundle` (the CW-E2 delivery helper, never the
# model runtime) imports `packaging.version.Version` / `InvalidVersion` and
# `packaging.requirements.Requirement` to validate canonical PEP 440 versions
# and compare normalized Requires-Dist metadata. 23 is a conservative floor
# (strict, LegacyVersion-free parsing since 22); only 26.3 (MAPLE .venv and
# .venv-cupy) has been exercised. This declares a third-party requirement of
# the helper; the bundle itself carries the MAPLE project only, not packages.
dependency-delivery = [
    "packaging>=23",
]

[project.scripts]
maple-syrup-probe = "maple_syrup.probe:main"
maple-syrup-plot1-import = "maple_syrup.case_import:main"
maple-syrup-columns = "maple_syrup.column_experiment:main"
maple-syrup-storm = "maple_syrup.storm_experiment:main"
maple-syrup-sediment = "maple_syrup.sediment_experiment:main"
maple-syrup-event = "maple_syrup.event_experiment:main"
maple-syrup-benchmark = "maple_syrup.benchmark_experiment:main"
maple-syrup-legacy = "maple_syrup.legacy_experiment:main"
# CW-E5: explicit conservative resident-window runner (same as
# `python -m maple_syrup.windowed_experiment`); never a default workflow.
maple-syrup-windowed = "maple_syrup.windowed_experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Phase suites are collected by default; the older port_feasibility/
# experiment keeps its own invocation. CW-E5 adds the four general
# conservative-water suites (no frozen-snapshot oracle paths); the historical
# task families (cw_b*, cw_e2, cw_f2, ...) are run explicitly, see
# docs/conservative_water_usage.md. ORDER MATTERS: these suites and
# tests/phase2 have non-package `conftest.py` files, which pytest's default
# prepend import mode registers under the one module name `conftest` (the
# last loaded wins). phase2 tests run `from conftest import PLOT1_DIR`, so the
# conservative suites are listed BEFORE phase2 to keep phase2's conftest last.
testpaths = ["tests/splash_spill", "tests/pond", "tests/pond_transport", "tests/pond_friction", "tests/pond_event", "tests/pond_checkpoint", "tests/conservative_water", "tests/conservative_csr", "tests/conservative_csr_event", "tests/conservative_pits", "tests/phase1", "tests/phase2", "tests/phase3", "tests/phase4", "tests/phase5", "tests/phase6", "tests/phase7", "tests/phase7b", "tests/phase7f"]
pythonpath = ["src"]
